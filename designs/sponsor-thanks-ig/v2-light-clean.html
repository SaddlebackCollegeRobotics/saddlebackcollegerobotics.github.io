<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SC Robotics — Sponsor Thanks (Light Clean)</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    background: #ffffff;
    color: #1a1a1a;
    font-family: 'Roboto Mono', monospace;
    overflow: hidden;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .post {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .top-bar, .bottom-bar {
    width: 100%;
    height: 12px;
    background: #c3080f;
    flex-shrink: 0;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 40px 64px 0;
    flex-shrink: 0;
  }

  .club-logo { height: 42px; width: auto; object-fit: contain; }

  .club-sub {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(0,0,0,0.4);
  }

  .headline-zone {
    padding: 52px 64px 0;
    flex-shrink: 0;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #c3080f;
    margin-bottom: 16px;
  }

  .headline {
    font-family: 'Lexend Deca', sans-serif;
    font-weight: 800;
    font-size: 60px;
    line-height: 1.05;
    letter-spacing: -1px;
  }

  .headline .accent { color: #c3080f; }

  .subhead {
    margin-top: 20px;
    font-size: 15px;
    line-height: 1.6;
    color: rgba(0,0,0,0.55);
    max-width: 640px;
    font-weight: 500;
  }

  .sponsor-zone {
    flex: 1;
    padding: 48px 64px 0;
    display: flex;
    align-items: center;
  }

  .sponsor-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .sponsor-tile {
    background: #0a0a0a;
    border-radius: 4px;
    height: 132px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 30px;
  }

  .sponsor-tile img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .footer {
    flex-shrink: 0;
    padding: 0 64px 36px;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: rgba(0,0,0,0.1);
    margin: 32px 0 20px;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: rgba(0,0,0,0.35);
  }

  .footer-value {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    margin-top: 4px;
  }

  .footer-value.accent { color: #c3080f; }
</style>
</head>
<body>
<div class="post">
  <div class="top-bar"></div>

  <div class="header">
    <img class="club-logo" src="../../assets/sc-robotics-logo-dark-text.png" alt="SC Robotics">
    <div class="club-sub">University Rover Challenge &nbsp;·&nbsp; Est. 2018</div>
  </div>

  <div class="headline-zone">
    <div class="eyebrow">Mission Support</div>
    <div class="headline">Thank you to our <span class="accent">sponsors.</span></div>
    <div class="subhead">Our rover doesn't reach Mars without ground support. These partners fund, fabricate, and equip every subsystem on the vehicle.</div>
  </div>

  <div class="sponsor-zone">
    <div class="sponsor-grid">
      <div class="sponsor-tile"><img src="../../assets/uploads/sponsors/altium.png" alt="Altium"></div>
      <div class="sponsor-tile"><img src="../../assets/uploads/sponsors/dassault.png" alt="Dassault Systèmes"></div>
      <div class="sponsor-tile"><img src="../../assets/uploads/sponsors/sendcutsend.png" alt="SendCutSend"></div>
      <div class="sponsor-tile"><img src="../../assets/uploads/sponsors/oshcut.png" alt="OSH Cut"></div>
      <div class="sponsor-tile"><img src="../../assets/uploads/sponsors/protospace.png" alt="Protospace MFG"></div>
      <div class="sponsor-tile"><img src="../../assets/uploads/sponsors/irvine.png" alt="Irvine Electro-Optics"></div>
      <div class="sponsor-tile"><img src="../../assets/uploads/sponsors/bild.png" alt="Bild"></div>
      <div class="sponsor-tile"><img src="../../assets/uploads/sponsors/saddleback.png" alt="Saddleback College"></div>
    </div>
  </div>

  <div class="footer">
    <div class="divider"></div>
    <div class="footer-row">
      <div>
        <div class="footer-label">Website</div>
        <div class="footer-value accent">saddlebackcollegerobotics.com</div>
      </div>
      <div>
        <div class="footer-label">Team</div>
        <div class="footer-value">Saddleback College Robotics</div>
      </div>
    </div>
  </div>

  <div class="bottom-bar"></div>
</div>
</body>
</html>
